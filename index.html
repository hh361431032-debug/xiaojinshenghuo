<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5ef"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="assets/icon.svg"><title>小金生活</title><script src="config.js"></script>
<style>
:root{--bg:#f7f5ef;--card:#fff;--text:#262522;--muted:#77736b;--line:#e9e5dc;--accent:#2f6f57;--danger:#c94a4a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:90px}header{padding:28px 20px 12px}h1{margin:0 0 6px;font-size:32px}h2{margin:0;font-size:24px}.sub,p{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:14px 18px}.card,.item{background:#fff;border:1px solid var(--line);border-radius:20px}.card{padding:22px;min-height:150px;cursor:pointer}.card .icon{font-size:34px;margin-bottom:20px}.card b{font-size:19px;display:block;margin-bottom:6px}.count,.meta{font-size:13px;color:var(--muted)}.top{display:flex;align-items:center;gap:12px;padding:20px;position:sticky;top:0;background:var(--bg);z-index:5}.top .spacer{flex:1}.top .addtop{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:10px 13px;font-weight:700}.back,.secondary,.smallbtn{border:0;background:#ebe8e0;border-radius:12px;padding:10px 13px}.list{padding:0 16px}.item{padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px}.fab{position:fixed;right:20px;bottom:20px;border:0;background:var(--accent);color:#fff;border-radius:28px;padding:14px 20px;font-weight:700;box-shadow:0 8px 25px #0003}.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:10}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:20px}label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}input,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font:inherit}textarea{min-height:90px}.actions{display:flex;gap:10px;margin-top:18px}.primary{border:0;border-radius:13px;padding:13px 16px;background:var(--accent);color:#fff;font-weight:700;flex:1}.notice{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 16px;color:var(--muted);font-size:13px}.mapbox{height:360px;margin:0 16px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#ddd}.maptools,.chips{display:flex;gap:8px;padding:12px 16px}.maptools input{flex:1}.chip{border:0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:9px 12px}.result{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 16px 10px}.result-actions{display:flex;gap:8px;margin-top:10px}.result-actions button{border:0;border-radius:10px;padding:8px 10px}.add{background:#e7f1eb;color:var(--accent)}.empty{text-align:center;padding:60px 20px;color:var(--muted)}
 .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.auth-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 15px 50px #0000000d}.auth-logo{width:62px;height:62px;border-radius:18px;background:#e7f1eb;display:grid;place-items:center;font-size:32px;margin-bottom:18px}.auth-card h1{font-size:30px;margin-bottom:6px}.auth-card .sub{margin-bottom:24px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:#f3f1eb;border-radius:13px;padding:4px;margin-bottom:18px}.auth-tab{border:0;background:transparent;border-radius:10px;padding:10px;font-weight:700;color:var(--muted)}.auth-tab.active{background:#fff;color:var(--text);box-shadow:0 2px 8px #0000000d}.auth-card label{margin-top:12px}.auth-card .primary{width:100%;margin-top:4px}.auth-error{min-height:20px;color:var(--danger);font-size:13px;margin-top:10px}.auth-tip{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.6} .system-btn{position:fixed;right:20px;bottom:20px;border:0;background:#262522;color:#fff;border-radius:50%;width:54px;height:54px;font-size:24px;box-shadow:0 8px 25px #0003;z-index:6}.system-panel{position:fixed;right:20px;bottom:84px;width:min(320px,calc(100% - 40px));background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 15px 45px #0003;z-index:7}</style></head><body><main id="app" class="app"></main>
<script>
let user=null,db={recipes:[],groceries:[],restaurants:[]},amap=null,marker=null;
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function key(){return "xiaojinshenghuo:"+user.username}
function save(){localStorage.setItem(key(),JSON.stringify(db))}
function load(){try{db=JSON.parse(localStorage.getItem(key()))||db}catch(e){}}
function shell(title){return '<div class="top"><button class="back" onclick="home()">‹ 返回</button><h2>'+esc(title)+'</h2></div>'}
function modal(title,body,ok){document.body.insertAdjacentHTML("beforeend",'<div class="modal" id="modal"><div class="sheet"><h2>'+title+'</h2>'+body+'<div class="actions"><button class="secondary" onclick="closeModal()">取消</button><button class="primary" onclick="'+ok+'">保存</button></div></div></div>')}
function closeModal(){$("modal")?.remove()}
function system(){let u=user||{};$("app").insertAdjacentHTML("beforeend",'<div class="system-panel" id="systemPanel"><b>系统</b><div class="meta" style="margin:10px 0">账号：'+esc(u.username||"")+'<br>用户：'+esc(u.displayName||"")+'</div><button class="secondary" onclick="map()">🗺️ 地图</button> <button class="secondary" onclick="showAuth(\'login\');user=null;localStorage.removeItem("xiaojinshenghuo:session")">退出登录</button></div>')} 
function home(){load();$("app").innerHTML='<header><h1>'+esc(APP_CONFIG.app.name)+'</h1><p>'+esc(APP_CONFIG.app.subtitle)+' · '+esc(user.displayName)+'</p></header><div class="grid">'+card("🍳","菜谱","recipes",db.recipes.length+" 个")+" "+card("🛒","超市","groceries",db.groceries.length+" 项")+" "+card("🍽️","餐厅","restaurants",db.restaurants.length+" 家")+'</div><button class="system-btn" onclick="system()">⚙</button>'}
function card(i,t,k,c){return '<div class="card" onclick="'+k+'()"><div class="icon">'+i+'</div><b>'+t+'</b><span class="count">'+c+'</span></div>'}
function getAccounts(){let local=[];try{local=JSON.parse(localStorage.getItem("xiaojinshenghuo:accounts")||"[]")}catch(e){}return [...(APP_CONFIG.accounts||[]),...local]}
function showAuth(mode){const isReg=mode==="register";var html='<div class="auth-page"><div class="auth-card"><div class="auth-logo">🍳</div><h1>'+esc(APP_CONFIG.app.name)+'</h1><p class="sub">'+esc(APP_CONFIG.app.subtitle)+'</p><div class="auth-tabs"><button class="auth-tab '+(!isReg?'active':'')+'" onclick="showAuth(\'login\')">登录</button><button class="auth-tab '+(isReg?'active':'')+'" onclick="showAuth(\'register\')">注册</button></div><label>账号</label><input id="au" autocomplete="username" placeholder="请输入账号"><label>密码</label><input id="ap" type="password" autocomplete="'+(isReg?'new-password':'current-password')+'" placeholder="'+(isReg?'至少 6 位密码':'请输入密码')+'">'+(isReg?'<label>确认密码</label><input id="ap2" type="password" autocomplete="new-password" placeholder="再次输入密码">':'')+'<div id="authError" class="auth-error"></div><button class="primary" onclick="'+(isReg?'registerAccount()':'loginAccount()')+'">'+(isReg?'创建账号':'登录')+'</button><div class="auth-tip">账号数据保存在当前设备。本版本为本地账号系统，没有联网账号服务器。</div></div></div>';$("app").innerHTML=html;$("au")?.focus()}
function loginAccount(){var u=$("au").value.trim(),p=$("ap").value,a=getAccounts().find(x=>x.username===u&&x.password===p);if(!a){$("authError").textContent="账号或密码错误";return}user=a;localStorage.setItem("xiaojinshenghuo:session",u);load();home()}
function registerAccount(){var u=$("au").value.trim(),p=$("ap").value,p2=$("ap2").value;if(!/^[A-Za-z0-9_]{3,20}$/.test(u)){$("authError").textContent="账号需为3-20位字母、数字或下划线";return}if(p.length<6){$("authError").textContent="密码至少6位";return}if(p!==p2){$("authError").textContent="两次密码不一致";return}if(getAccounts().some(x=>x.username===u)){$("authError").textContent="这个账号已经存在";return}var local=[];try{local=JSON.parse(localStorage.getItem("xiaojinshenghuo:accounts")||"[]")}catch(e){}var account={username:u,password:p,displayName:u};local.push(account);localStorage.setItem("xiaojinshenghuo:accounts",JSON.stringify(local));user=account;localStorage.setItem("xiaojinshenghuo:session",u);db={recipes:[],groceries:[],restaurants:[]};save();home()}
function logout(){user=null;localStorage.removeItem("xiaojinshenghuo:session");showAuth("login")}
function recipes(){let list=db.recipes.map(r=>'<div class="item"><div><b>'+esc(r.name)+'</b><div class="meta">'+esc(r.note||"")+'</div></div><button class="smallbtn" onclick="delRecipe(\''+r.id+'\')">删除</button></div>').join("");$("app").innerHTML=shell("菜谱")+'<div class="list">'+(list||'<div class="empty">还没有菜谱</div>')+'</div><button class="fab" onclick="addRecipe()">＋ 菜谱</button>'}
function addRecipe(){modal("添加菜谱",'<label>菜名</label><input id="rn" placeholder="例如：番茄炒蛋"><label>备注</label><textarea id="rt" placeholder="食材、做法、口味"></textarea>','saveRecipe()')}
function saveRecipe(){let n=$("rn").value.trim();if(!n)return alert("请输入菜名");db.recipes.unshift({id:Date.now()+"",name:n,note:$("rt").value.trim()});save();closeModal();recipes()}
function delRecipe(id){db.recipes=db.recipes.filter(x=>x.id!==id);save();recipes()}
function groceries(){let list=db.groceries.map(r=>'<div class="item"><div><b>'+esc(r.name)+'</b><div class="meta">'+esc(r.info||"")+'</div></div><button class="smallbtn" onclick="delG(\''+r.id+'\')">删除</button></div>').join("");$("app").innerHTML=shell("采购")+'<div class="list">'+(list||'<div class="empty">还没有采购记录</div>')+'</div><button class="fab" onclick="addG()">＋ 采购</button>'}
function addG(){modal("添加采购",'<label>商品</label><input id="gn"><label>备注</label><input id="gi" placeholder="规格、价格、数量">','saveG()')}
function saveG(){let n=$("gn").value.trim();if(!n)return alert("请输入商品");db.groceries.unshift({id:Date.now()+"",name:n,info:$("gi").value.trim()});save();closeModal();groceries()}
function delG(id){db.groceries=db.groceries.filter(x=>x.id!==id);save();groceries()}
function restaurants(){let list=db.restaurants.map(r=>'<div class="item"><div><b>'+esc(r.name)+'</b><div class="meta">'+esc(r.city||"")+ (r.area?" · "+esc(r.area):"")+(r.category?" · "+esc(r.category):"")+'</div><div class="meta">'+esc(r.address||"")+'</div><div class="meta">'+esc(r.note||"")+'</div></div><button class="smallbtn" onclick="delR(\''+r.id+'\')">删除</button></div>').join("");$( "app").innerHTML=shell("餐厅")+'<div class="notice" style="margin-top:0"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><input id="fcity" placeholder="城市"><input id="farea" placeholder="地区"><input id="fcat" placeholder="种类"></div></div><div class="list">'+(list||'<div class="empty">还没有餐厅</div>')+'</div><button class="fab" onclick="addRestaurant()">＋ 餐厅</button>';["fcity","farea","fcat"].forEach(id=>$(id).addEventListener("input",filterRestaurants))}
function filterRestaurants(){let c=($( "fcity")?.value||"").trim().toLowerCase(),a=($( "farea")?.value||"").trim().toLowerCase(),t=($( "fcat")?.value||"").trim().toLowerCase();document.querySelectorAll(".list .item").forEach(el=>{let x=el.textContent.toLowerCase();el.style.display=(!c||x.includes(c))&&(!a||x.includes(a))&&(!t||x.includes(t))?"flex":"none"})}
function addRestaurant(p={}){modal("添加餐厅",'<label>餐厅名称</label><input id="rn" value="'+esc(p.name||"")+'"><label>城市</label><input id="rci" value="'+esc(p.city||"")+'"><label>地区</label><input id="rar" value="'+esc(p.area||"")+'"><label>种类</label><input id="rc" value="'+esc(p.category||"")+'" placeholder="火锅 / 湖北菜 / 快餐"><label>地址</label><input id="ra" value="'+esc(p.address||"")+'"><label>备注</label><textarea id="rr">'+esc(p.note||"")+'</textarea>','saveR()')}
function saveR(){let n=$( "rn").value.trim();if(!n)return alert("请输入餐厅名称");db.restaurants.unshift({id:Date.now()+"",name:n,city:$( "rci").value.trim(),area:$( "rar").value.trim(),category:$( "rc").value.trim(),address:$( "ra").value.trim(),note:$( "rr").value.trim()});save();closeModal();restaurants()}
function delR(id){db.restaurants=db.restaurants.filter(x=>x.id!==id);save();restaurants()}
function loadMapScript(){return new Promise((res,rej)=>{if(window.AMap)return res();if(!APP_CONFIG.amap.key)return rej(Error("请在 config.js 填写高德地图 Key"));window._AMapSecurityConfig={securityJsCode:APP_CONFIG.amap.securityJsCode};let s=document.createElement("script");s.src="https://webapi.amap.com/maps?v="+APP_CONFIG.amap.version+"&key="+encodeURIComponent(APP_CONFIG.amap.key);s.onload=res;s.onerror=()=>rej(Error("高德地图加载失败"));document.head.appendChild(s)})}
async function map(){ $("app").innerHTML=shell("地图")+'<div class="maptools"><input id="mq" placeholder="搜索菜市场、超市、餐厅"><button class="primary" style="flex:0 0 auto" onclick="searchMap()">搜索</button></div><div class="chips"><button class="chip" onclick="quick(\'菜市场\')">🥬 菜市场</button><button class="chip" onclick="quick(\'农贸市场\')">🧺 农贸市场</button><button class="chip" onclick="quick(\'超市\')">🛒 超市</button><button class="chip" onclick="quick(\'餐厅\')">🍽️ 餐厅</button></div><div id="map" class="mapbox"></div><div id="results"></div>';try{await loadMapScript();amap=new AMap.Map("map",{zoom:APP_CONFIG.amap.defaultZoom,center:APP_CONFIG.amap.defaultCenter,resizeEnable:true});}catch(e){$( "map").innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
function quick(q){$("mq").value=q;searchMap()}
function searchMap(){let q=$("mq").value.trim();if(!q||!amap)return;AMap.plugin("AMap.PlaceSearch",()=>{new AMap.PlaceSearch({pageSize:10}).search(q,(status,result)=>{if(status!=="complete")return $("results").innerHTML='<div class="empty">没有找到结果</div>';let ps=result.poiList?.pois||[];$("results").innerHTML=ps.map((p,i)=>{let lng=p.location?.lng,lat=p.location?.lat;let data=encodeURIComponent(JSON.stringify({name:p.name,address:p.address||"",category:p.type||"餐厅",lng,lat}));return '<div class="result"><b>'+esc(p.name)+'</b><div class="meta">'+esc(p.address||p.type||"")+'</div><div class="result-actions"><button onclick="focusPoi('+lng+','+lat+')">📍 定位</button><button class="add" onclick="addFromMap(\''+data+'\')">＋ 加入餐厅</button></div></div>'}).join("")||'<div class="empty">没有找到结果</div>'})})}
function focusPoi(lng,lat){if(!amap||!lng||!lat)return;amap.setZoomAndCenter(16,[lng,lat]);if(marker)amap.remove(marker);marker=new AMap.Marker({position:[lng,lat]});amap.add(marker)}
function addFromMap(data){try{addRestaurant(JSON.parse(decodeURIComponent(data)))}catch(e){addRestaurant()}}
function boot(){var session=localStorage.getItem("xiaojinshenghuo:session"),a=session&&getAccounts().find(x=>x.username===session);if(a){user=a;load();home()}else showAuth("login")}boot();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js?v=3").catch(()=>{});
</script></body></html>
