<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5ef">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon.svg">
<title>小金生活</title>
<script src="config.js"></script>
<style>
:root{--bg:#f7f5ef;--card:#fff;--text:#262522;--muted:#77736b;--line:#e9e5dc;--accent:#2f6f57;--danger:#c94a4a;--iconColor:#2f6f57;--fontFamily:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fontFamily)}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:90px}
header{padding:32px 20px 14px}h1{margin:0 0 6px;font-size:32px}h2{margin:0;font-size:23px}.sub,p{color:var(--muted);margin:0}
.grid{display:flex;flex-direction:column;gap:8px;padding:10px 10px;min-height:100vh;justify-content:center;align-items:center}.card{display:flex;align-items:center;justify-content:center;min-height:64px;padding:10px 4px}.card .icon{font-size:32px;margin:0 18px 0 0;color:var(--iconColor)}.card,.item{background:#fff;border:1px solid var(--line);border-radius:20px}.card{border:2px dashed var(--line);border-radius:18px}.card{cursor:pointer;width:min(360px,calc(100% - 32px))}.card .icon{font-size:34px;margin:0 6px 0 0}.card b{font-size:17px;display:block;margin:0}.card .count{margin-left:6px}.count,.meta{font-size:13px;color:var(--muted)}
.top{display:flex;align-items:center;gap:12px;padding:20px;position:sticky;top:0;background:var(--bg);z-index:5}.top .addtop{order:1}.top .back{order:0}.top h2{order:2}.top .spacer{flex:1}.back,.secondary,.smallbtn,.chip{border:0;background:#ebe8e0;border-radius:12px;padding:10px 13px}.bottom-actions .back{border:0;background:#2f6f57;color:#fff;border-radius:28px;padding:14px 20px;font-weight:700;box-shadow:0 8px 25px #0003}.addtop{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:10px 13px;font-weight:700}
.list{padding:0 16px}.item{padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px}.bottom-actions{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;z-index:10}.fab{position:static;transform:none;border:0;background:var(--accent);color:#fff;border-radius:28px;padding:14px 20px;font-weight:700;box-shadow:0 8px 25px #0003}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:20}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:20px}label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}input,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font:inherit}textarea{min-height:90px}.actions{display:flex;gap:10px;margin-top:18px}.primary{border:0;border-radius:13px;padding:13px 16px;background:var(--accent);color:#fff;font-weight:700;flex:1}.notice{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 16px;color:var(--muted);font-size:13px}
.mapbox{height:360px;margin:0 16px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#ddd}.maptools,.chips{display:flex;gap:8px;padding:12px 16px}.maptools input{flex:1}.chip{background:#fff;border:1px solid var(--line);border-radius:18px}.result{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 16px 10px}.result-actions{display:flex;gap:8px;margin-top:10px}.result-actions button{border:0;border-radius:10px;padding:8px 10px}.add{background:#e7f1eb;color:var(--accent)}.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.auth-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 15px 50px #0001}.auth-logo{width:62px;height:62px;border-radius:18px;background:#e7f1eb;display:grid;place-items:center;font-size:32px;margin-bottom:18px}.auth-card h1{font-size:30px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:#f3f1eb;border-radius:13px;padding:4px;margin:20px 0}.auth-tab{border:0;background:transparent;border-radius:10px;padding:10px;font-weight:700;color:var(--muted)}.auth-tab.active{background:#fff;color:var(--text)}.auth-error{min-height:20px;color:var(--danger);font-size:13px;margin-top:10px}.auth-tip{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.6}
.system-btn{position:fixed;right:18px;bottom:18px;border:0;background:transparent;color:var(--text);border-radius:18px 0 0 18px;width:52px;height:86px;font-size:24px;box-shadow:0 8px 25px #0003;z-index:30}.system-panel{position:fixed;right:0;top:0;height:100vh;width:min(340px,88vw);background:var(--card);border-left:1px solid var(--line);padding:24px 18px;box-shadow:-15px 0 45px #0003;z-index:31;overflow:auto;animation:sysin .22s ease}@keyframes sysin{from{transform:translateX(100%)}to{transform:translateX(0)}}.display-section{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.display-row{margin:14px 0}.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.swatch{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}.font-row{display:flex;gap:8px;flex-wrap:wrap}.font-btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;cursor:pointer}
.filter{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 16px 12px}
@media(max-width:520px){.filter{grid-template-columns:1fr}.grid{gap:10px;padding:12px}.card{padding:18px}}
</style>
</head>
<body><main id="app" class="app"></main>
<script>
"use strict";
var user=null;
var db={recipes:[],groceries:[],restaurants:[]};
var amap=null,marker=null;

function $(id){return document.getElementById(id)}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function storeKey(){return "xiaojinshenghuo:"+user.username}
function save(){localStorage.setItem(storeKey(),JSON.stringify(db))}
function load(){try{db=JSON.parse(localStorage.getItem(storeKey())||"null")||{recipes:[],groceries:[],restaurants:[]}}catch(e){db={recipes:[],groceries:[],restaurants:[]}}}
function accounts(){var a=[];try{a=JSON.parse(localStorage.getItem("xiaojinshenghuo:accounts")||"[]")}catch(e){}return (APP_CONFIG.accounts||[]).concat(a)}
function shell(title,addText,addFn){return '<div class="top"><h2>'+esc(title)+'</h2></div>'}
function card(icon,title,action,count){return '<div class="card" data-action="'+action+'"><div class="icon">'+icon+'</div><b>'+title+'</b><span class="count">'+count+'</span></div>'}

function home(){load();$("app").innerHTML='<div class="grid">'+card("🍳","菜谱","recipes",db.recipes.length+" 个")+card("🛒","超市","groceries",db.groceries.length+" 项")+card("🍽️","餐厅","restaurants",db.restaurants.length+" 家")+'</div><button class="system-btn" data-action="system">⚙</button>'}

function showAuth(mode){var reg=mode==="register";$("app").innerHTML='<div class="auth-page"><div class="auth-card"><div class="auth-logo">🍳</div><h1>'+esc(APP_CONFIG.app.name)+'</h1><p>'+esc(APP_CONFIG.app.subtitle)+'</p><div class="auth-tabs"><button class="auth-tab '+(reg?"":"active")+'" data-action="authLogin">登录</button><button class="auth-tab '+(reg?"active":"")+'" data-action="authRegister">注册</button></div><label>账号</label><input id="au" autocomplete="username" placeholder="请输入账号"><label>密码</label><input id="ap" type="password" placeholder="'+(reg?"至少 6 位密码":"请输入密码")+'">'+(reg?'<label>确认密码</label><input id="ap2" type="password" placeholder="再次输入密码">':"")+'<div id="authError" class="auth-error"></div><button class="primary" data-action="'+(reg?"register":"login")+'">'+(reg?"创建账号":"登录")+'</button><div class="auth-tip">账号数据保存在当前设备。本版本为本地账号系统。</div></div></div>'}
function loginAccount(){var u=$("au").value.trim(),p=$("ap").value,a=accounts().find(function(x){return x.username===u&&x.password===p});if(!a){$("authError").textContent="账号或密码错误";return}user=a;localStorage.setItem("xiaojinshenghuo:session",u);home()}
function registerAccount(){var u=$("au").value.trim(),p=$("ap").value,p2=$("ap2").value;if(!/^[A-Za-z0-9_]{3,20}$/.test(u))return $("authError").textContent="账号需为3-20位字母、数字或下划线";if(p.length<6)return $("authError").textContent="密码至少6位";if(p!==p2)return $("authError").textContent="两次密码不一致";if(accounts().some(function(x){return x.username===u}))return $("authError").textContent="这个账号已经存在";var a=[];try{a=JSON.parse(localStorage.getItem("xiaojinshenghuo:accounts")||"[]")}catch(e){}var x={username:u,password:p,displayName:u};a.push(x);localStorage.setItem("xiaojinshenghuo:accounts",JSON.stringify(a));user=x;db={recipes:[],groceries:[],restaurants:[]};save();localStorage.setItem("xiaojinshenghuo:session",u);home()}
function swatches(type,arr){return arr.map(function(x){return '<button class="swatch" style="background:'+x+'" data-color-type="'+type+'" data-color="'+x+'" aria-label="'+x+'"></button>'}).join("")}
function loadDisplay(){try{var s=JSON.parse(localStorage.getItem("xiaojinshenghuo:display")||"{}");applyDisplay(s);return s}catch(e){return {}}}
function applyDisplay(s){s=s||{};if(s.bg)document.documentElement.style.setProperty("--bg",s.bg);if(s.icon)document.documentElement.style.setProperty("--iconColor",s.icon);if(s.fontData){try{var ff=new FontFace("UserFont","url("+s.fontData+")");ff.load().then(function(f){document.fonts.add(f);document.documentElement.style.setProperty("--fontFamily","UserFont")})}catch(e){}}else if(s.font){var f=s.font==="serif"?"SimSun,serif":s.font==="mono"?"Consolas,monospace":'-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';document.documentElement.style.setProperty("--fontFamily",f)}}
function setDisplay(type,color){var s=JSON.parse(localStorage.getItem("xiaojinsheng:display")||"{}");s[type]=color;localStorage.setItem("xiaojinsheng:display",JSON.stringify(s));applyDisplay(s)}
function logout(){user=null;localStorage.removeItem("xiaojinshenghuo:session");showAuth("login")}
function system(){
if($("systemPanel")){$("systemPanel").remove();return}
$("app").insertAdjacentHTML("beforeend",'<div class="system-panel" id="systemPanel"><div style="display:flex;align-items:center;gap:10px"><b style="font-size:22px">系统</b><span class="spacer"></span><button class="secondary" data-action="system">关闭</button></div><div class="meta" style="margin:10px 0">账号：'+esc(user.username)+'<br>用户：'+esc(user.displayName)+'</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" data-action="map">🗺️ 地图</button><button class="secondary" data-action="display">🎨 显示</button><button class="secondary" data-action="logout">退出登录</button></div></div>')
}
function display(){
if($("displayPanel")){$("displayPanel").remove();return}
var s={};try{s=JSON.parse(localStorage.getItem("xiaojinshenghuo:display")||"{}")}catch(e){}
$("app").insertAdjacentHTML("beforeend",'<div class="system-panel" id="displayPanel"><div style="display:flex;align-items:center;gap:10px"><button class="secondary" data-action="closeDisplay">‹ 返回</button><b style="font-size:22px">显示</b></div><div class="display-section"><b>网页底纹</b><div class="display-row"><input id="bgColor" type="color" value="'+(s.bg||"#f7f5ef")+'" style="width:100%;height:48px;padding:4px"></div><b>图标颜色</b><div class="display-row"><input id="iconColor" type="color" value="'+(s.icon||"#2f6f57")+'" style="width:100%;height:48px;padding:4px"></div><b>字体</b><div class="display-row"><input id="fontFile" type="file" accept=".ttf,.otf,.woff,.woff2"><div id="fontStatus" class="meta" style="margin-top:8px">可上传 TTF / OTF / WOFF / WOFF2 字体</div></div></div></div>')
}
function closeDisplay(){if($("displayPanel"))$("displayPanel").remove()}
function saveColor(type,value){var s={};try{s=JSON.parse(localStorage.getItem("xiaojinshenghuo:display")||"{}")}catch(e){}s[type]=value;localStorage.setItem("xiaojinshenghuo:display",JSON.stringify(s));applyDisplay(s)}


function recipes(){load();var list=db.recipes.map(function(r){return '<div class="item"><div><b>'+esc(r.name)+'</b><div class="meta">'+esc(r.note)+'</div></div><button class="smallbtn" data-del-recipe="'+esc(r.id)+'">删除</button></div>'}).join("");$("app").innerHTML=shell("菜谱",null,null)+'<div class="list">'+(list||'<div class="empty">还没有菜谱</div>')+'</div><div class="bottom-actions"><button class="back" data-action="home">‹ 返回</button><button class="fab" data-action="addRecipe">＋ 添加菜谱</button></div>'}
function addRecipe(){modal("添加菜谱",'<label>菜名</label><input id="rn"><label>备注</label><textarea id="rt"></textarea>',"saveRecipe")}
function saveRecipe(){var n=$("rn").value.trim();if(!n)return alert("请输入菜名");db.recipes.unshift({id:Date.now()+"",name:n,note:$("rt").value.trim()});save();closeModal();recipes()}

function groceries(){load();var list=db.groceries.map(function(r){return '<div class="item"><div><b>'+esc(r.name)+'</b><div class="meta">'+esc(r.info)+'</div></div><button class="smallbtn" data-del-g="'+esc(r.id)+'">删除</button></div>'}).join("");$("app").innerHTML=shell("超市",null,null)+'<div class="list">'+(list||'<div class="empty">还没有超市记录</div>')+'</div><div class="bottom-actions"><button class="back" data-action="home">‹ 返回</button><button class="fab" data-action="addG">＋ 添加商品</button></div>'}
function addG(){modal("添加超市商品",'<label>商品</label><input id="gn"><label>备注</label><input id="gi" placeholder="规格、价格、数量">',"saveG")}
function saveG(){var n=$("gn").value.trim();if(!n)return alert("请输入商品");db.groceries.unshift({id:Date.now()+"",name:n,info:$("gi").value.trim()});save();closeModal();groceries()}

function restaurants(){load();var list=db.restaurants.map(function(r){return '<div class="item restaurant-item" data-city="'+esc(r.city)+'" data-area="'+esc(r.area)+'" data-cat="'+esc(r.category)+'"><div><b>'+esc(r.name)+'</b><div class="meta">'+esc(r.city)+(r.area?" · "+esc(r.area):"")+(r.category?" · "+esc(r.category):"")+'</div><div class="meta">'+esc(r.address)+'</div><div class="meta">'+esc(r.note)+'</div></div><button class="smallbtn" data-del-r="'+esc(r.id)+'">删除</button></div>'}).join("");$("app").innerHTML=shell("餐厅","＋ 添加餐厅","addRestaurant")+'<div class="filter"><input id="fcity" placeholder="城市"><input id="farea" placeholder="地区"><input id="fcat" placeholder="种类"></div><div class="list">'+(list||'<div class="empty">还没有餐厅</div>')+'</div><div class="bottom-actions"><button class="back" data-action="home">‹ 返回</button><button class="fab" data-action="addRestaurant">＋ 添加餐厅</button></div>'}
function filterRestaurants(){var c=($("fcity").value||"").trim().toLowerCase(),a=($("farea").value||"").trim().toLowerCase(),t=($("fcat").value||"").trim().toLowerCase();document.querySelectorAll(".restaurant-item").forEach(function(e){var ok=(!c||e.dataset.city.toLowerCase().includes(c))&&(!a||e.dataset.area.toLowerCase().includes(a))&&(!t||e.dataset.cat.toLowerCase().includes(t));e.style.display=ok?"flex":"none"})}
function addRestaurant(p){p=p||{};modal("添加餐厅",'<label>餐厅名称</label><input id="rname" value="'+esc(p.name)+'"><label>城市</label><input id="rcity" value="'+esc(p.city)+'"><label>地区</label><input id="rarea" value="'+esc(p.area)+'"><label>种类</label><input id="rcat" value="'+esc(p.category)+'" placeholder="火锅 / 湖北菜 / 快餐"><label>地址</label><input id="raddr" value="'+esc(p.address)+'"><label>备注</label><textarea id="rnote">'+esc(p.note)+'</textarea>',"saveR")}
function saveR(){var n=$("rname").value.trim();if(!n)return alert("请输入餐厅名称");db.restaurants.unshift({id:Date.now()+"",name:n,city:$("rcity").value.trim(),area:$("rarea").value.trim(),category:$("rcat").value.trim(),address:$("raddr").value.trim(),note:$("rnote").value.trim()});save();closeModal();restaurants()}

function modal(title,body,fn){$("app").insertAdjacentHTML("beforeend",'<div class="modal" id="modal"><div class="sheet"><h2>'+title+'</h2>'+body+'<div class="actions"><button class="secondary" data-action="closeModal">取消</button><button class="primary" data-action="'+fn+'">保存</button></div></div></div>')}
function closeModal(){if($("modal"))$("modal").remove()}

function loadMapScript(){return new Promise(function(resolve,reject){if(window.AMap)return resolve();if(!APP_CONFIG.amap.key)return reject(new Error("请在 config.js 填写高德地图 Key"));window._AMapSecurityConfig={securityJsCode:APP_CONFIG.amap.securityJsCode};var s=document.createElement("script");s.src="https://webapi.amap.com/maps?v="+APP_CONFIG.amap.version+"&key="+encodeURIComponent(APP_CONFIG.amap.key);s.onload=resolve;s.onerror=function(){reject(new Error("高德地图加载失败"))};document.head.appendChild(s)})}
async function map(){$("app").innerHTML=shell("地图","＋ 添加餐厅","addRestaurant")+'<div class="maptools"><input id="mq" placeholder="搜索菜市场、超市、餐厅"><button class="primary" data-action="searchMap">搜索</button></div><div class="chips"><button class="chip" data-q="菜市场">🥬 菜市场</button><button class="chip" data-q="农贸市场">🧺 农贸市场</button><button class="chip" data-q="超市">🛒 超市</button><button class="chip" data-q="餐厅">🍽️ 餐厅</button></div><div id="map" class="mapbox"></div><div id="results"></div>';try{await loadMapScript();amap=new AMap.Map("map",{zoom:APP_CONFIG.amap.defaultZoom,center:APP_CONFIG.amap.defaultCenter,resizeEnable:true})}catch(e){$("map").innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
function searchMap(){var q=$("mq").value.trim();if(!q||!amap)return;AMap.plugin("AMap.PlaceSearch",function(){new AMap.PlaceSearch({pageSize:10}).search(q,function(status,result){if(status!=="complete"){return $("results").innerHTML='<div class="empty">没有找到结果</div>'}var ps=result.poiList&&result.poiList.pois||[];$("results").innerHTML=ps.map(function(p,i){var lng=p.location&&p.location.lng,lat=p.location&&p.location.lat;var data=encodeURIComponent(JSON.stringify({name:p.name,address:p.address||"",category:p.type||"餐厅",lng:lng,lat:lat}));return '<div class="result"><b>'+esc(p.name)+'</b><div class="meta">'+esc(p.address||p.type||"")+'</div><div class="result-actions"><button data-focus="'+lng+','+lat+'">📍 定位</button><button class="add" data-add-map="'+data+'">＋ 加入餐厅</button></div></div>'}).join("")||'<div class="empty">没有找到结果</div>'})})}
function focusPoi(lng,lat){if(!amap)return;amap.setZoomAndCenter(16,[Number(lng),Number(lat)]);if(marker)amap.remove(marker);marker=new AMap.Marker({position:[Number(lng),Number(lat)]});amap.add(marker)}

document.addEventListener("click",function(e){
var a=e.target.closest("[data-action]");
if(a){
var act=a.dataset.action;
if(act==="home")home();
else if(act==="system")system();
else if(act==="map")map();
else if(act==="display")display();
else if(act==="closeDisplay"){closeDisplay();system()}
else if(act==="logout")logout();
else if(act==="authLogin")showAuth("login");
else if(act==="authRegister")showAuth("register");
else if(act==="login")loginAccount();
else if(act==="register")registerAccount();
else if(act==="recipes")recipes();
else if(act==="groceries")groceries();
else if(act==="restaurants")restaurants();
else if(act==="addRecipe")addRecipe();
else if(act==="saveRecipe")saveRecipe();
else if(act==="addG")addG();
else if(act==="saveG")saveG();
else if(act==="addRestaurant")addRestaurant();
else if(act==="saveR")saveR();
else if(act==="closeModal")closeModal();
else if(act==="searchMap")searchMap();
}
var q=e.target.closest("[data-q]");
if(q){$("mq").value=q.dataset.q;searchMap()}
var d=e.target.closest("[data-del-recipe]");
if(d){db.recipes=db.recipes.filter(function(x){return x.id!==d.dataset.delRecipe});save();recipes()}
d=e.target.closest("[data-del-g]");
if(d){db.groceries=db.groceries.filter(function(x){return x.id!==d.dataset.delG});save();groceries()}
d=e.target.closest("[data-del-r]");
if(d){db.restaurants=db.restaurants.filter(function(x){return x.id!==d.dataset.delR});save();restaurants()}
d=e.target.closest("[data-focus]");
if(d){var p=d.dataset.focus.split(",");focusPoi(p[0],p[1])}
d=e.target.closest("[data-add-map]");
if(d){try{addRestaurant(JSON.parse(decodeURIComponent(d.dataset.addMap)))}catch(err){addRestaurant()}}
});
document.addEventListener("input",function(e){if(e.target.id==="fcity"||e.target.id==="farea"||e.target.id==="fcat")filterRestaurants()});
document.addEventListener("input",function(e){if(e.target.id==="bgColor")saveColor("bg",e.target.value);if(e.target.id==="iconColor")saveColor("icon",e.target.value)});
document.addEventListener("change",function(e){if(e.target.id==="fontFile"&&e.target.files&&e.target.files[0]){var file=e.target.files[0],reader=new FileReader();reader.onload=function(){var s={};try{s=JSON.parse(localStorage.getItem("xiaojinshenghuo:display")||"{}")}catch(e){}s.fontData=reader.result;s.fontName=file.name;localStorage.setItem("xiaojinshenghuo:display",JSON.stringify(s));applyDisplay(s);if($("fontStatus"))$("fontStatus").textContent="已使用："+file.name};reader.readAsDataURL(file)}});

function boot(){var s=localStorage.getItem("xiaojinshenghuo:session");var a=s&&accounts().find(function(x){return x.username===s});if(a){user=a;home()}else showAuth("login")}
boot();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js?v=6").catch(function(){})}
</script>
</body></html>
