<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5ef">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon.svg">
<title>小金生活</title>
<script src="config.js"></script>
<style>
:root{--bg:#f8eef1;--card:rgba(255,255,255,.72);--text:#5f5055;--muted:#9b858d;--line:rgba(190,150,165,.38);--accent:#c995a8;--danger:#c98295;--iconColor:#c995a8;--fontFamily:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fontFamily)}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:90px}
header{padding:32px 20px 14px}h1{margin:0 0 6px;font-size:32px}h2{margin:0;font-size:23px}.sub,p{color:var(--muted);margin:0}
.grid{display:flex;flex-direction:column;gap:8px;padding:10px 10px;min-height:100vh;justify-content:center;align-items:center}.card{display:flex;align-items:center;justify-content:center;min-height:64px;padding:10px 4px}.card .icon{font-size:32px;margin:0 18px 0 0;color:var(--iconColor)}.card,.item{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:20px}.card{border:2px dashed var(--line);border-radius:18px}.card{cursor:pointer;width:min(300px,calc(100% - 80px))}.card .icon{font-size:34px;margin:0 6px 0 0}.card b{font-size:17px;display:block;margin:0}.card .count{margin-left:6px}.count,.meta{font-size:13px;color:var(--muted)}
.top{display:flex;align-items:center;gap:12px;padding:20px;position:sticky;top:0;background:var(--bg);z-index:5}.top .addtop{order:1}.top .back{order:0}.top h2{order:2}.top .spacer{flex:1}.back,.secondary,.smallbtn,.chip{border:0;background:#ebe8e0;border-radius:12px;padding:10px 13px}.bottom-actions .back{border:0;background:#fff;color:var(--accent);border-radius:28px;padding:14px 20px;font-weight:700;box-shadow:0 8px 25px #0003}.addtop{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:10px 13px;font-weight:700}
.list{padding:0 16px}.item{padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px}.bottom-actions{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;z-index:10}.fab{position:static;transform:none;border:0;background:var(--accent);color:#fff;border-radius:28px;padding:14px 20px;font-weight:700;box-shadow:0 8px 25px #0003}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:20}.sheet{position:relative;width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:20px}label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;color:#111;border-radius:12px;padding:12px;font:inherit}select option{background:#f1eeee;color:#111}textarea{min-height:90px}.actions{display:flex;gap:10px;margin-top:18px}.primary{border:0;border-radius:13px;padding:13px 16px;background:var(--accent);color:#fff;font-weight:700;flex:1}.notice{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 16px;color:var(--muted);font-size:13px}
.mapbox{height:360px;margin:0 16px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#ddd}.maptools,.chips{display:flex;gap:8px;padding:12px 16px}.maptools input{flex:1}.chip{background:#fff;border:1px solid var(--line);border-radius:18px}.result{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 16px 10px}.result-actions{display:flex;gap:8px;margin-top:10px}.result-actions button{border:0;border-radius:10px;padding:8px 10px}.add{background:#e7f1eb;color:var(--accent)}.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.auth-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 15px 50px #0001}.auth-logo{width:62px;height:62px;border-radius:18px;background:#e7f1eb;display:grid;place-items:center;font-size:32px;margin-bottom:18px}.auth-card h1{font-size:30px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:#f3f1eb;border-radius:13px;padding:4px;margin:20px 0}.auth-tab{border:0;background:transparent;border-radius:10px;padding:10px;font-weight:700;color:var(--muted)}.auth-tab.active{background:#fff;color:var(--text)}.auth-error{min-height:20px;color:var(--danger);font-size:13px;margin-top:10px}.auth-tip{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.6}
.system-btn{position:fixed;left:50%;right:auto;transform:translateX(-50%);bottom:18px;border:0;background:transparent;color:#e1aebe;border-radius:50%;width:56px;height:56px;font-size:34px;box-shadow:0 8px 25px #0003;z-index:30}.system-panel{position:fixed;right:0;top:0;height:100vh;width:60vw;max-width:none;background:var(--card);border-left:1px solid var(--line);padding:24px 18px;box-shadow:-15px 0 45px #0003;z-index:31;overflow:auto;animation:sysin .22s ease}.system-menu{display:flex;flex-direction:column;gap:10px;margin-top:24px}.system-menu button{width:100%;text-align:center}.system-menu button{color:var(--text)}.system-bottom{position:absolute;left:18px;right:18px;bottom:24px;display:flex;align-items:center;justify-content:center;gap:14px}.system-close{border:0;background:var(--accent);color:#fff;border-radius:28px;padding:12px 22px;font-weight:700}.system-user{font-size:12px;color:var(--muted);line-height:1.7}.system-panel .secondary{background:rgba(255,255,255,.72)}@keyframes sysin{from{transform:translateX(100%)}to{transform:translateX(0)}}.display-section{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.display-row{margin:14px 0}.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.swatch{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}.font-row{display:flex;gap:8px;flex-wrap:wrap}.font-btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;cursor:pointer}
.recipe-side{position:absolute;right:0;top:0;height:100%;width:50%;max-width:none;background:var(--bg);border-left:1px solid var(--line);padding:20px 18px;box-shadow:-15px 0 45px #0003;z-index:32;overflow:hidden;animation:sysin .22s ease;display:flex;flex-direction:column}.recipe-ingredients{flex:1;overflow:auto;padding-bottom:4px}.recipe-ingredient{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;touch-action:pan-y;overflow:hidden}.recipe-ingredient-content{transition:transform .18s ease;position:relative;z-index:2;background:#fff}.recipe-swipe-actions{position:absolute;right:0;top:0;bottom:0;display:flex;z-index:1}.recipe-swipe-actions button{width:58px;border:0;color:#fff;font-weight:700}.recipe-edit{background:#c995a8}.recipe-delete{background:#c98295}.recipe-side .actions{flex-shrink:0}.city-suggestions{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #0002;max-height:240px;overflow:auto;z-index:25;display:none}.city-suggestions button{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:#fff;color:#111;padding:11px 12px;text-align:left;font:inherit}.city-suggestions button+button{border-top:1px solid #eee}.city-suggestions small{color:var(--muted);font-size:11px}.filter{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 16px 12px}
@media(max-width:520px){.filter{grid-template-columns:repeat(3,1fr);gap:5px;margin-left:8px;margin-right:8px}.filter input{min-width:0;padding:10px 6px;font-size:13px}.grid{gap:10px;padding:12px}.card{padding:14px 4px;width:min(300px,calc(100% - 80px))}}
</style>
</head>
<body><main id="app" class="app"></main>
<script>
"use strict";
var user=null;
var db={recipes:[],groceries:[],restaurants:[]};
var amap=null,marker=null;

function $(id){return document.getElementById(id)}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function storeKey(){return "xiaojinshenghuo:"+user.username}
function save(){localStorage.setItem(storeKey(),JSON.stringify(db))}
function load(){try{db=JSON.parse(localStorage.getItem(storeKey())||"null")||{recipes:[],groceries:[],restaurants:[]}}catch(e){db={recipes:[],groceries:[],restaurants:[]}}}
function accounts(){var a=[];try{a=JSON.parse(localStorage.getItem("xiaojinshenghuo:accounts")||"[]")}catch(e){}return (APP_CONFIG.accounts||[]).concat(a)}
function shell(title,addText,addFn){return '<div class="top" style="justify-content:center"><h2>'+esc(title)+'</h2></div>'}
function card(icon,title,action,count){return '<div class="card" data-action="'+action+'"><div class="icon">'+icon+'</div><b>'+title+'</b><span class="count">'+count+'</span></div>'}

function home(){load();$("app").innerHTML='<div class="grid">'+card("🍳","菜谱","recipes",db.recipes.length+" 个")+card("🛒","超市","groceries",db.groceries.length+" 项")+card("🍽️","餐厅","restaurants",db.restaurants.length+" 家")+'</div><button class="system-btn" data-action="system">♥</button>'}

function showAuth(mode){var reg=mode==="register";$("app").innerHTML='<div class="auth-page"><div class="auth-card"><div class="auth-logo">🍳</div><h1>'+esc(APP_CONFIG.app.name)+'</h1><p>'+esc(APP_CONFIG.app.subtitle)+'</p><div class="auth-tabs"><button class="auth-tab '+(reg?"":"active")+'" data-action="authLogin">登录</button><button class="auth-tab '+(reg?"active":"")+'" data-action="authRegister">注册</button></div><label>账号</label><input id="au" autocomplete="username" placeholder="请输入账号"><label>密码</label><input id="ap" type="password" placeholder="'+(reg?"至少 6 位密码":"请输入密码")+'">'+(reg?'<label>确认密码</label><input id="ap2" type="password" placeholder="再次输入密码">':"")+'<div id="authError" class="auth-error"></div><button class="primary" data-action="'+(reg?"register":"login")+'">'+(reg?"创建账号":"登录")+'</button><div class="auth-tip">账号数据保存在当前设备。本版本为本地账号系统。</div></div></div>'}
function loginAccount(){var u=$("au").value.trim(),p=$("ap").value,a=accounts().find(function(x){return x.username===u&&x.password===p});if(!a){$("authError").textContent="账号或密码错误";return}user=a;localStorage.setItem("xiaojinshenghuo:session",u);home()}
function registerAccount(){var u=$("au").value.trim(),p=$("ap").value,p2=$("ap2").value;if(!/^[A-Za-z0-9_]{3,20}$/.test(u))return $("authError").textContent="账号需为3-20位字母、数字或下划线";if(p.length<6)return $("authError").textContent="密码至少6位";if(p!==p2)return $("authError").textContent="两次密码不一致";if(accounts().some(function(x){return x.username===u}))return $("authError").textContent="这个账号已经存在";var a=[];try{a=JSON.parse(localStorage.getItem("xiaojinshenghuo:accounts")||"[]")}catch(e){}var x={username:u,password:p,displayName:u};a.push(x);localStorage.setItem("xiaojinshenghuo:accounts",JSON.stringify(a));user=x;db={recipes:[],groceries:[],restaurants:[]};save();localStorage.setItem("xiaojinshenghuo:session",u);home()}
function swatches(type,arr){return arr.map(function(x){return '<button class="swatch" style="background:'+x+'" data-color-type="'+type+'" data-color="'+x+'" aria-label="'+x+'"></button>'}).join("")}
function loadDisplay(){try{var s=JSON.parse(localStorage.getItem("xiaojinshenghuo:display")||"{}");applyDisplay(s);return s}catch(e){return {}}}
function applyDisplay(s){s=s||{};if(s.bg)document.documentElement.style.setProperty("--bg",s.bg);if(s.icon)document.documentElement.style.setProperty("--iconColor",s.icon);if(s.fontData){try{var ff=new FontFace("UserFont","url("+s.fontData+")");ff.load().then(function(f){document.fonts.add(f);document.documentElement.style.setProperty("--fontFamily","UserFont")})}catch(e){}}else if(s.font){var f=s.font==="serif"?"SimSun,serif":s.font==="mono"?"Consolas,monospace":'-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';document.documentElement.style.setProperty("--fontFamily",f)}}
function setDisplay(type,color){var s=JSON.parse(localStorage.getItem("xiaojinsheng:display")||"{}");s[type]=color;localStorage.setItem("xiaojinsheng:display",JSON.stringify(s));applyDisplay(s)}
function logout(){user=null;localStorage.removeItem("xiaojinshenghuo:session");showAuth("login")}
function system(){
if($("systemPanel")){$("systemPanel").remove();return}
$("app").insertAdjacentHTML("beforeend",'<div class="system-panel" id="systemPanel"><div style="display:flex;align-items:center;gap:10px"><b style="font-size:22px">系统</b></div><div class="system-menu"><button class="secondary" data-action="map">地图</button><button class="secondary" data-action="display">显示</button></div><div class="system-bottom"><button class="system-close" data-action="logout">退出登录</button><div class="system-user">账号：<b>'+esc(user.username)+'</b><br>用户：'+esc(user.displayName)+'</div></div></div>');
var panel=$("systemPanel"),sx=0;
panel.addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});
panel.addEventListener("touchend",function(e){if(e.changedTouches[0].clientX-sx>70)panel.remove()},{passive:true})
}
function display(){
if($("displayPanel")){$("displayPanel").remove();return}
var s={};try{s=JSON.parse(localStorage.getItem("xiaojinshenghuo:display")||"{}")}catch(e){}
$("app").insertAdjacentHTML("beforeend",'<div class="system-panel" id="displayPanel"><div style="display:flex;align-items:center;gap:10px"><button class="secondary" data-action="closeDisplay">‹ 返回</button><b style="font-size:22px">显示</b></div><div class="display-section"><b>网页底纹</b><div class="display-row"><input id="bgColor" type="color" value="'+(s.bg||"#f7f5ef")+'" style="width:100%;height:48px;padding:4px"></div><b>图标颜色</b><div class="display-row"><input id="iconColor" type="color" value="'+(s.icon||"#2f6f57")+'" style="width:100%;height:48px;padding:4px"></div><b>字体</b><div class="display-row"><input id="fontFile" type="file" accept=".ttf,.otf,.woff,.woff2"><div id="fontStatus" class="meta" style="margin-top:8px">可上传 TTF / OTF / WOFF / WOFF2 字体</div></div></div></div>')
}
function closeDisplay(){if($("displayPanel"))$("displayPanel").remove()}
function saveColor(type,value){var s={};try{s=JSON.parse(localStorage.getItem("xiaojinshenghuo:display")||"{}")}catch(e){}s[type]=value;localStorage.setItem("xiaojinshenghuo:display",JSON.stringify(s));applyDisplay(s)}


function recipes(){load();var list=db.recipes.map(function(r){return '<div class="item"><div><b>'+esc(r.name)+'</b><div class="meta">'+esc(r.recipe||"未填写配方")+'</div><div class="meta">'+esc(r.note||"")+'</div></div><button class="smallbtn" data-del-recipe="'+esc(r.id)+'">删除</button></div>'}).join("");$("app").innerHTML=shell("菜谱",null,null)+'<div class="list">'+(list||'<div class="empty">还没有菜谱</div>')+'</div><div class="bottom-actions"><button class="back" data-action="home">‹ 返回</button><button class="fab" data-action="addRecipe">＋ 添加菜谱</button></div>'}
function addRecipe(){window._recipeIngredients=[];modal("添加菜谱",'<label>菜名</label><input id="rn"><label>配方</label><button class="secondary" style="width:100%;text-align:left" data-action="recipeFormula">点击填写食材 / 数量 / 备注</button><div id="recipePreview" class="meta" style="margin-top:7px"></div><label>备注</label><input id="rt">',"saveRecipe")}
function recipeFormula(){
if($("recipeFormulaPanel")){$("recipeFormulaPanel").remove();return}
var list=window._recipeIngredients||[];
var panel=document.createElement("div");panel.id="recipeFormulaPanel";panel.className="recipe-side";
panel.innerHTML='<h2>配方</h2><div class="recipe-ingredients" id="recipeIngredients"></div><button class="secondary" style="width:100%;margin-top:10px" data-action="addRecipeIngredient">＋ 添加食材</button><div class="actions"><button class="primary" data-action="saveRecipeFormula">保存配方</button></div>';
$("app").appendChild(panel);renderRecipeIngredients();
}
function renderRecipeIngredients(){
var box=$("recipeIngredients");if(!box)return;
var list=window._recipeIngredients||[];
box.innerHTML=list.map(function(x,i){
return '<div class="recipe-ingredient" data-ingredient-index="'+i+'"><div class="recipe-swipe-actions"><button class="recipe-edit" data-edit-ingredient="'+i+'">修改</button><button class="recipe-delete" data-delete-ingredient="'+i+'">删除</button></div><div class="recipe-ingredient-content"><b>'+esc(x.ingredient||"未填写食材")+'</b><div class="meta">'+esc(x.qty||"未填写数量")+(x.note?" · "+esc(x.note):"")+'</div></div></div>'
}).join("")||( '<div class="empty" style="padding:35px 10px">还没有食材，点击下方添加</div>');
bindIngredientSwipe();
}
function addRecipeIngredient(editIndex){
var list=window._recipeIngredients||[],x=editIndex==null?{}:(list[editIndex]||{});
var body='<label>食材</label><input id="rfi" value="'+esc(x.ingredient||"")+'" placeholder="例如：鸡胸肉"><label>数量</label><input id="rfq" value="'+esc(x.qty||"")+'" placeholder="例如：200g"><label>备注</label><input id="rfn" value="'+esc(x.note||"")+'">';
$("recipeIngredientEditor")?.remove();
var p=document.createElement("div");p.id="recipeIngredientEditor";p.className="recipe-side";p.style.zIndex="33";
p.innerHTML='<h2>'+(editIndex==null?"添加食材":"修改食材")+'</h2>'+body+'<div class="actions"><button class="secondary" data-action="closeRecipeIngredientEditor">取消</button><button class="primary" data-action="saveRecipeIngredient" data-edit-index="'+(editIndex==null?"":editIndex)+'">保存</button></div>';
$("app").appendChild(p);
}
function closeRecipeIngredientEditor(){if($("recipeIngredientEditor"))$("recipeIngredientEditor").remove()}
function saveRecipeIngredient(editIndex){
var ingredient=$("rfi").value.trim(),qty=$("rfq").value.trim(),note=$("rfn").value.trim();
if(!ingredient)return alert("请输入食材");
var x={ingredient:ingredient,qty:qty,note:note},list=window._recipeIngredients||[];
if(editIndex==="")list.push(x);else list[Number(editIndex)]=x;
window._recipeIngredients=list;closeRecipeIngredientEditor();renderRecipeIngredients();
}
function bindIngredientSwipe(){
document.querySelectorAll(".recipe-ingredient").forEach(function(el){
var sx=0,dx=0;
el.addEventListener("touchstart",function(e){sx=e.touches[0].clientX;dx=0},{passive:true});
el.addEventListener("touchmove",function(e){dx=e.touches[0].clientX-sx;if(dx<0)el.querySelector(".recipe-ingredient-content").style.transform="translateX("+Math.max(dx,-116)+"px)"},{passive:true});
el.addEventListener("touchend",function(){if(dx<-60)el.querySelector(".recipe-ingredient-content").style.transform="translateX(-116px)";else el.querySelector(".recipe-ingredient-content").style.transform="translateX(0)"},{passive:true});
});
}
function saveRecipe(){var n=$("rn").value.trim();if(!n)return alert("请输入菜名");var list=window._recipeIngredients||[];if(!list.length)return alert("请至少添加一种食材");db.recipes.unshift({id:Date.now()+"",name:n,recipe:list.map(function(x){return x.ingredient+(x.qty?" · "+x.qty:"")+(x.note?" · "+x.note:"")}).join("；"),ingredients:list,note:$("rt").value.trim()});window._recipeIngredients=null;save();closeModal();recipes()}

function groceries(){load();var list=db.groceries.map(function(r){return '<div class="item"><div><b>'+esc(r.name)+'</b><div class="meta">数量：'+esc(r.qty||"未填写")+' · 价格：'+esc(r.price||"未填写")+' · 来源：'+esc(r.source||"其他")+'</div><div class="meta">'+esc(r.info||"")+'</div></div><button class="smallbtn" data-del-g="'+esc(r.id)+'">删除</button></div>'}).join("");$("app").innerHTML=shell("超市",null,null)+'<div class="list">'+(list||'<div class="empty">还没有超市记录</div>')+'</div><div class="bottom-actions"><button class="back" data-action="home">‹ 返回</button><button class="fab" data-action="addG">＋ 添加商品</button></div>'}
function addG(){modal("添加超市商品",'<label>商品</label><input id="gn"><label>数量</label><input id="gq" type="number" min="0" step="1" placeholder="数量"><label>价格</label><input id="gp" type="number" min="0" step="0.01" placeholder="¥"><label>来源</label><select id="gs" style="width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font:inherit"><option>盒马生鲜</option><option>山姆</option><option>朴朴</option><option>小象</option><option>其他</option></select><label>备注</label><input id="gi" placeholder="规格等信息">',"saveG")}
function saveG(){var n=$("gn").value.trim();if(!n)return alert("请输入商品");db.groceries.unshift({id:Date.now()+"",name:n,qty:$("gq").value.trim(),price:$("gp").value.trim(),source:$("gs").value,info:$("gi").value.trim()});save();closeModal();groceries()}

function showCitySuggestions(force){
  var input=$("rcity"),box=$("citySuggestions");if(!input||!box)return;
  if(!force&&document.activeElement!==input)return;
  var q=input.value.trim().toLowerCase();
  var hits=cityList.filter(function(x){return !q||x[0].toLowerCase().indexOf(q)>=0||x[1].indexOf(q)===0}).slice(0,12);
  box.innerHTML=hits.map(function(x){return '<button type="button" data-city-choice="'+esc(x[0])+'"><span>'+esc(x[0])+'</span><small>'+x[1].toUpperCase()+'</small></button>'}).join("");
  box.style.display=hits.length?"block":"none";
}
function addRestaurant(p){
  p=p||{};var city=p.city||"广州";
  modal("添加餐厅",'<label>餐厅名称</label><input id="rname" value="'+esc(p.name||"")+'"><label>城市</label><div style="position:relative"><input id="rcity" autocomplete="off" value="'+esc(city)+'" placeholder="输入城市或首字母"><div id="citySuggestions" class="city-suggestions"></div></div><label>地区</label><select id="rdistrict" style="width:100%;border:1px solid var(--line);background:#fff;color:#111;border-radius:12px;padding:12px;font:inherit"><option value="">选择区县</option></select><div id="districtHint" class="meta" style="margin-top:6px">根据城市自动加载</div><label>种类</label><input id="rcat" value="'+esc(p.category||"")+'"><label>地址</label><input id="raddr" value="'+esc(p.address||"")+'"><label>备注</label><input id="rnote" value="'+esc(p.note||"")+'">',"saveR");
  if($("citySuggestions"))$("citySuggestions").style.display="none";
  loadRestaurantDistricts(city);
}
function loadRestaurantDistricts(city){
  var a=$("rdistrict"),hint=$("districtHint"),old=a&&a.value;if(!a)return;
  var local=[];
  Object.keys(cityData||{}).some(function(p){if(cityData[p]&&cityData[p][city]){local=cityData[p][city];return true}return false});
  if(local.length){
    a.innerHTML=local.map(function(x){return "<option>"+esc(x)+"</option>"}).join("");
    a.disabled=false;
    if(old&&Array.from(a.options).some(function(o){return o.value===old}))a.value=old;
    if(hint)hint.textContent="已根据城市加载区县";
    return;
  }
  a.innerHTML="<option value=\"\">正在加载区县…</option>";a.disabled=true;
  function run(){
    AMap.plugin("AMap.DistrictSearch",function(){
      var ds=new AMap.DistrictSearch({level:"city",subdistrict:1,showbiz:false,extensions:"all"});
      ds.search(city,function(status,result){
        var list=[];
        if(status==="complete"&&result.districtList&&result.districtList[0])list=result.districtList[0].districtList||[];
        a.innerHTML=list.map(function(x){return "<option>"+esc(x.name)+"</option>"}).join("");
        a.disabled=false;
        if(!list.length)a.innerHTML="<option value=\"\">暂无区县数据</option>";
        if(old&&Array.from(a.options).some(function(o){return o.value===old}))a.value=old;
        if(hint)hint.textContent=list.length?"已根据城市加载区县":"可手动输入区县";
      });
    });
  }
  if(window.AMap)run();else loadMapScript().then(run).catch(function(){a.disabled=false;a.innerHTML="<option value=\"\">区县加载失败，可稍后重试</option>"});
}
function saveR(){

  db.restaurants.unshift({id:Date.now()+"",name:n,city:city,region:"",area:$("rdistrict").value.trim(),category:$("rcat").value.trim(),address:$("raddr").value.trim(),note:$("rnote").value.trim()});
  save();closeModal();restaurants();
}

function loadMapScript(){return new Promise(function(resolve,reject){if(window.AMap)return resolve();if(!APP_CONFIG.amap.key)return reject(new Error("请在 config.js 填写高德地图 Key"));window._AMapSecurityConfig={securityJsCode:APP_CONFIG.amap.securityJsCode};var s=document.createElement("script");s.src="https://webapi.amap.com/maps?v="+APP_CONFIG.amap.version+"&key="+encodeURIComponent(APP_CONFIG.amap.key);s.onload=resolve;s.onerror=function(){reject(new Error("高德地图加载失败"))};document.head.appendChild(s)})}

function searchMap(){var q=$("mq").value.trim();if(!q||!amap)return;AMap.plugin("AMap.PlaceSearch",function(){new AMap.PlaceSearch({pageSize:10}).search(q,function(status,result){if(status!=="complete"){return $("results").innerHTML='<div class="empty">没有找到结果</div>'}var ps=result.poiList&&result.poiList.pois||[];$("results").innerHTML=ps.map(function(p,i){var lng=p.location&&p.location.lng,lat=p.location&&p.location.lat;var data=encodeURIComponent(JSON.stringify({name:p.name,address:p.address||"",category:p.type||"餐厅",lng:lng,lat:lat}));return '<div class="result"><b>'+esc(p.name)+'</b><div class="meta">'+esc(p.address||p.type||"")+'</div><div class="result-actions"><button data-focus="'+lng+','+lat+'">📍 定位</button><button class="add" data-add-map="'+data+'">＋ 加入餐厅</button></div></div>'}).join("")||'<div class="empty">没有找到结果</div>'})})}
function focusPoi(lng,lat){if(!amap)return;amap.setZoomAndCenter(16,[Number(lng),Number(lat)]);if(marker)amap.remove(marker);marker=new AMap.Marker({position:[Number(lng),Number(lat)]});amap.add(marker)}
